<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Soundtrack to Awakening</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:,">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,700&family=Jost:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap');

  :root{
    --bg:#f5efe1;
    --surface:#fffdf7;
    --ink:#1e2a1c;
    --ink-soft:#4b5744;
    --moss:#5b6b52;
    --gold:#a8762c;
    --gold-bright:#c79640;
    --gold-glow:#e8b96a;
    --root-brown:#6e4b31;
    --mist:#7d8b76;
    --line:rgba(30,42,28,0.15);
    --shadow:rgba(30,42,28,0.22);
    --scrim-top: rgba(15,20,12,0.05);
    --scrim-bottom: rgba(10,14,8,0.55);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e1610;
      --surface:#161f17;
      --ink:#f1ead9;
      --ink-soft:#c8d1be;
      --moss:#83936f;
      --gold:#d9ae5c;
      --gold-bright:#f0c878;
      --gold-glow:#f6d48a;
      --root-brown:#b08256;
      --mist:#8fa089;
      --line:rgba(241,234,217,0.14);
      --shadow:rgba(0,0,0,0.55);
      --scrim-top: rgba(0,0,0,0.05);
      --scrim-bottom: rgba(0,0,0,0.65);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e1610;
    --surface:#161f17;
    --ink:#f1ead9;
    --ink-soft:#c8d1be;
    --moss:#83936f;
    --gold:#d9ae5c;
    --gold-bright:#f0c878;
    --gold-glow:#f6d48a;
    --root-brown:#b08256;
    --mist:#8fa089;
    --line:rgba(241,234,217,0.14);
    --shadow:rgba(0,0,0,0.55);
    --scrim-top: rgba(0,0,0,0.05);
    --scrim-bottom: rgba(0,0,0,0.65);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{
    background:#000;
  }
  /* Pinned to the viewport purely via inset:0 on a fixed element -- no
     vh/dvh height math at all, so there's no dependency on how any given
     mobile browser resolves dynamic-toolbar viewport units. This is what
     actually guarantees zero gap top/bottom, vs. also setting an explicit
     height alongside inset:0 (over-constrained: the two can disagree by a
     px or more depending on the browser's dvh rounding, which is exactly
     what shows up as a sliver of background above/below the video). */
  body{
    background:#000;
    color:var(--ink);
    font-family:'Jost', 'Trebuchet MS', sans-serif;
    overflow:hidden;
    position:fixed;
    inset:0;
  }

  /* ---- scenes: true full-screen mobile viewport ---- */
  .scene{
    position:fixed; inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    opacity:0;
    visibility:hidden;
    transition:opacity 900ms ease;
    text-align:center;
  }
  .scene.active{ opacity:1; visibility:visible; }

  /* Scene 1: portal */
  #scene-portal{
    cursor:pointer;
    background:#0c1108;
  }
  .layer-img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    object-position:58% 42%;
  }
  /* Layer 0: the fallback still is the base layer, always visible from
     first paint (no JS, no load event needed) -- a cold load on a slow
     connection never shows raw black while the loop buffers. The loop
     video sits above it, invisible until it actually fires 'playing'
     (real decoded frames on screen, not just "play() was called"), then
     fades in over the still. If autoplay is blocked entirely the video
     stays hidden and the still just remains the permanent background. */
  #portalLoopFallback{ z-index:1; }
  #portalLoop{
    z-index:2;
    opacity:0;
    transition:opacity 600ms ease;
  }
  #portalLoop.loop-ready{ opacity:1; }
  /* Layer 1: the real transition — plays once, in full, on tap. A longer,
     gentler crossfade (vs. an instant cut) also helps mask the last sliver
     of any residual pixel misalignment between the loop's and the
     transition's independently-generated content -- a slow dissolve reads
     as intentional, a hard cut makes even a couple of px read as a jump. */
  #transitionVideo{
    z-index:3;
    opacity:0;
    transition:opacity 750ms ease;
    object-position:56% 42%;
  }
  #scene-portal.bursting #transitionVideo{ opacity:1; }
  #scene-portal.bursting #portalLoop,
  #scene-portal.bursting #portalLoopFallback{ opacity:0; transition:opacity 750ms ease; }

  .portal-scrim{
    position:absolute; inset:0;
    z-index:4;
    background:linear-gradient(to bottom, var(--scrim-top) 0%, transparent 38%, var(--scrim-bottom) 100%);
    pointer-events:none;
  }
  /* Fades to solid black as the transition video finishes (timed to land
     exactly on its last frame), covers the cut to the Threshold scene, then
     fades back out to reveal it. Sits above every layer in both scenes. */
  .blackout{
    position:absolute; inset:0;
    z-index:45;
    background:#000;
    opacity:0;
    pointer-events:none;
    transition:opacity 900ms ease;
  }
  #burstCanvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events:none;
    z-index:6;
  }
  .tap-hint{
    position:absolute;
    top:calc(env(safe-area-inset-top, 0px) + 19%);
    left:50%;
    transform:translateX(-50%);
    z-index:5;
    margin:0;
    width:94%;
    max-width:600px;
    white-space:nowrap;
    text-align:center;
    font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Jost', 'Helvetica Neue', sans-serif;
    font-style:normal;
    font-weight:600;
    font-size:clamp(21px, 6.7vw, 29px);
    line-height:1.2;
    letter-spacing:0.19em;
    text-transform:uppercase;
    color:#ffd75e;
    text-shadow:
      0 6px 16px rgba(0,0,0,0.98),
      0 16px 44px rgba(0,0,0,0.92),
      0 1px 2px rgba(0,0,0,1),
      0 0 22px rgba(255,215,94,0.55),
      0 0 46px rgba(255,215,94,0.3);
    animation:hintPulse 2600ms ease-in-out infinite;
    transition:opacity 500ms ease;
  }
  #scene-portal.bursting .tap-hint{ opacity:0; animation:none; }
  @keyframes hintPulse{
    0%,100%{ opacity:0.6; }
    50%{ opacity:1; }
  }

  /* Scene 2: links — flat true black, no gradient, regardless of light/dark
     mode, so the reveal out of the blackout stays in the same register:
     nothing but the buttons themselves. */
  #scene-links{
    justify-content:center;
    padding:34px 26px calc(34px + env(safe-area-inset-bottom, 0px));
    background:#000;
  }
  .links-list{
    width:100%;
    max-width:280px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .platform-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:15px 20px;
    border-radius:999px;
    border:1px solid rgba(241,234,217,0.14);
    background:rgba(241,234,217,0.04);
    backdrop-filter:blur(6px);
    text-decoration:none;
    color:#f1ead9;
    transition:border-color 220ms ease, background 220ms ease, transform 220ms ease, box-shadow 220ms ease;
  }
  .platform-row:hover, .platform-row:focus-visible{
    border-color:rgba(232,185,106,0.55);
    background:rgba(232,185,106,0.08);
    transform:translateY(-1px);
    box-shadow:0 8px 24px -12px rgba(232,185,106,0.35);
    outline:none;
  }
  .platform-row .picon{
    flex:none;
    width:19px; height:19px;
    color:#e8b96a;
    opacity:0.92;
  }
  .platform-row .picon svg{ width:100%; height:100%; display:block; }
  .platform-row .pname{
    font-family:'Jost', sans-serif;
    font-size:13.5px;
    font-weight:500;
    letter-spacing:0.02em;
  }
  @media (prefers-reduced-motion: reduce){
    .tap-hint{ animation:none !important; }
  }

  .caption{
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    color:var(--mist);
    letter-spacing:0.04em;
    max-width:340px;
    text-align:center;
    line-height:1.6;
  }
  .caption b{ color:var(--ink-soft); font-weight:700; }
</style>
</head>
<body>

<div class="scene active" id="scene-portal">
  <video id="portalLoop" class="layer-img" autoplay muted loop playsinline preload="auto" poster="assets/fallback.jpg">
    <source src="assets/portal-loop.mp4" type="video/mp4">
  </video>
  <img id="portalLoopFallback" class="layer-img" src="assets/fallback.jpg" alt="">

  <video id="transitionVideo" class="layer-img" playsinline preload="auto" poster="assets/transition-poster.jpg">
    <source src="assets/transition.mp4" type="video/mp4">
  </video>

  <div class="portal-scrim"></div>
  <canvas id="burstCanvas"></canvas>
  <div class="tap-hint">Tap to Awaken</div>
</div>

<div class="scene" id="scene-links">
  <div class="links-list">
    <a class="platform-row" href="#" data-platform="spotify">
      <span class="picon"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9.25" stroke="currentColor" stroke-width="1.4"/><path d="M7 10.2c3.2-.8 6.8-.5 9.6 1.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M7.6 13.1c2.7-.6 5.6-.4 8 .9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M8.2 16c2.1-.4 4.3-.3 6.1.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span>
      <span class="pname">Spotify</span>
    </a>
    <a class="platform-row" href="#" data-platform="apple">
      <span class="picon"><svg viewBox="0 0 24 24" fill="none"><path d="M15.6 3.5c.1 1-.3 1.9-.9 2.6-.6.7-1.6 1.3-2.6 1.2-.1-1 .4-2 .9-2.6.6-.7 1.6-1.2 2.6-1.2Z" fill="currentColor"/><path d="M18.9 17.2c-.4.9-.6 1.3-1.1 2.1-.7 1.1-1.7 2.5-2.9 2.5-1.1 0-1.4-.7-2.9-.7s-1.9.7-2.9.7c-1.2 0-2.1-1.3-2.8-2.4-1.9-2.9-2.1-6.3-.9-8.1.8-1.3 2.2-2.1 3.5-2.1 1.3 0 2.1.7 3.2.7 1 0 1.7-.7 3.2-.7 1.1 0 2.3.6 3.1 1.6-2.7 1.5-2.3 5.4.5 6.4Z" fill="currentColor"/></svg></span>
      <span class="pname">Apple Music</span>
    </a>
    <a class="platform-row" href="#" data-platform="youtube">
      <span class="picon"><svg viewBox="0 0 24 24" fill="none"><rect x="2.75" y="6" width="18.5" height="12" rx="4" stroke="currentColor" stroke-width="1.4"/><path d="M10.3 9.6v4.8l4.4-2.4-4.4-2.4Z" fill="currentColor"/></svg></span>
      <span class="pname">YouTube</span>
    </a>
  </div>
</div>

<div class="blackout" id="blackout"></div>

<script>
(function(){
  var portal = document.getElementById('scene-portal');
  var links = document.getElementById('scene-links');
  var canvas = document.getElementById('burstCanvas');
  var ctx = canvas.getContext('2d');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var portalLoop = document.getElementById('portalLoop');
  var transitionVideo = document.getElementById('transitionVideo');

  // The fallback still (see its CSS comment) is the permanent base layer
  // and needs no JS at all. The loop video only ever needs to reveal
  // itself once it's actually rendering frames -- 'playing' is the event
  // for that, not 'canplay'/'loadeddata', which can fire before a frame
  // has really been decoded and painted on some mobile browsers. If
  // autoplay is blocked outright (iOS Low Power Mode, data saver, etc.)
  // or the source errors, the video just never gets 'loop-ready' and the
  // still quietly remains the permanent background for this load.
  if (portalLoop) {
    portalLoop.addEventListener('playing', function(){
      portalLoop.classList.add('loop-ready');
    });
    var loopAttempt = portalLoop.play();
    if (loopAttempt && loopAttempt.catch) loopAttempt.catch(function(){});
  }

  function sizeCanvas(){
    var rect = portal.getBoundingClientRect();
    canvas.width = rect.width * devicePixelRatio;
    canvas.height = rect.height * devicePixelRatio;
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }
  window.addEventListener('resize', sizeCanvas);

  // Small spark burst right at the tap point — a touch acknowledgment only.
  // The actual transition is transitionVideo playing through once, full
  // length, with its own embedded audio. (Audio was briefly split into a
  // separate element/file so a longer replacement track could outlast the
  // video, but that introduced its own failure mode: the two elements'
  // play() calls aren't perfectly synchronized, so on some devices/loads
  // they'd drift and the audio could end up finishing early relative to
  // the video. Merged back into one file/element for a single reliable
  // playback clock; revisit decoupling only alongside real synchronization
  // handling if a longer audio track is needed later.)
  var ripples = [];
  var rippleRaf = null;
  function spawnRipple(originX, originY){
    if (reduced) return;
    var colors = ['#f0c878','#e8b96a','#f6d48a','#fff3d9'];
    var count = 15;
    for (var i = 0; i < count; i++) {
      var angle = (i / count) * Math.PI * 2 + Math.random() * 0.35;
      var speed = 0.7 + Math.random() * 1.3;
      ripples.push({
        x: originX, y: originY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        born: performance.now(),
        size: 1 + Math.random() * 1.6,
        color: colors[i % colors.length]
      });
    }
    if (rippleRaf) return;
    var rect = portal.getBoundingClientRect();
    var LIFE = 900;
    function tick(){
      var now = performance.now();
      ctx.clearRect(0, 0, rect.width, rect.height);
      var alive = false;
      for (var i = ripples.length - 1; i >= 0; i--) {
        var p = ripples[i];
        var age = now - p.born;
        if (age > LIFE) { ripples.splice(i, 1); continue; }
        alive = true;
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.96;
        p.vy *= 0.96;
        var t = age / LIFE;
        ctx.globalAlpha = t < 0.55 ? 1 : 1 - (t - 0.55) / 0.45;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (1 - t * 0.3), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      rippleRaf = alive ? requestAnimationFrame(tick) : null;
    }
    rippleRaf = requestAnimationFrame(tick);
  }

  function goToLinks(){
    portal.classList.remove('active');
    links.classList.add('active');
  }

  // Known length of the transition clip (~7.07s) — used only as a failsafe
  // if 'ended' never fires (autoplay-with-sound blocked, decode error,
  // etc.), so a tap can never leave the visitor stuck on a frozen frame.
  var FALLBACK_DURATION_S = 7.1;
  var END_BUFFER_MS = 400; // fallback's grace period past the expected end
  var entering = false;
  var endHandled = false;
  var fallbackTimer = null;
  var fadeStartTimer = null;
  var blackout = document.getElementById('blackout');

  // Fade to black timed to land on the transition's last frame (started
  // pre-emptively, based on the clip's own reported duration — this is
  // cosmetic and independent of whichever event actually ends the phase
  // below), hold a beat, swap scenes underneath the black so the cut is
  // hidden, then fade back out to reveal the Threshold.
  var FADE_TO_BLACK_MS = 900;
  var HOLD_BLACK_MS = 250;
  var FADE_FROM_BLACK_MS = 700;

  function beginBlackout(){
    blackout.style.transitionDuration = FADE_TO_BLACK_MS + 'ms';
    blackout.style.opacity = '1';
  }

  // Mobile browsers commonly collapse their address-bar chrome on the very
  // gesture that starts the transition, which resizes the visual viewport
  // mid-crossfade -- portal is position:fixed + inset:0, so it (and every
  // layer inside it, all width:100%/height:100% of it) would reflow to the
  // new size while the loop's frozen frame and the transition video's first
  // frame are being compared, showing up as exactly the kind of shift a tap
  // triggers. Freezing portal to its current pixel size for the duration of
  // the transition (overriding inset:0 with an explicit top/left/width/
  // height snapshot) makes it immune to that reflow regardless of cause.
  // Released once we're safely on the links scene.
  function lockStageSize(){
    var vw = window.innerWidth, vh = window.innerHeight;
    portal.style.top = '0px';
    portal.style.left = '0px';
    portal.style.right = 'auto';
    portal.style.bottom = 'auto';
    portal.style.width = vw + 'px';
    portal.style.height = vh + 'px';
  }
  function unlockStageSize(){
    portal.style.top = '';
    portal.style.left = '';
    portal.style.right = '';
    portal.style.bottom = '';
    portal.style.width = '';
    portal.style.height = '';
  }

  // The single real end-of-transition trigger, reached via the video's own
  // 'ended' event (expected path) or the fallback timer (safety net only).
  // Guarded so whichever fires first wins and the other is a no-op.
  function completeTransition(){
    if (endHandled) return;
    endHandled = true;
    if (fallbackTimer) { clearTimeout(fallbackTimer); fallbackTimer = null; }
    if (fadeStartTimer) { clearTimeout(fadeStartTimer); fadeStartTimer = null; }
    // Snap to fully black in case the pre-emptive fade above hasn't
    // finished yet (e.g. the fallback fired because 'ended' never did).
    blackout.style.transitionDuration = '0ms';
    blackout.style.opacity = '1';
    setTimeout(function(){
      goToLinks();
      unlockStageSize();
      setTimeout(function(){
        blackout.style.transitionDuration = FADE_FROM_BLACK_MS + 'ms';
        blackout.style.opacity = '0';
      }, HOLD_BLACK_MS);
    }, 20);
  }

  portal.addEventListener('click', function(e){
    if (entering) return;
    entering = true;

    // First thing, before anything else can run: freeze the stage's pixel
    // size against mid-transition browser-chrome reflow (see
    // lockStageSize's comment above).
    lockStageSize();

    // Synchronous, in-tap .play() call — required for mobile autoplay-
    // with-sound policies. Fires before anything else in this handler,
    // independent of the loop-freeze logic below.
    if (transitionVideo) {
      try { transitionVideo.currentTime = 0; } catch (err) {}
      var p = transitionVideo.play();
      if (p && p.catch) p.catch(function(){});
    }

    // Everything that actually reveals the transition — deferred until the
    // loop is confirmed frozen on its own opening frame (see below).
    function reveal(){
      portal.classList.add('bursting');

      sizeCanvas();
      var rect = portal.getBoundingClientRect();
      var ox = (typeof e.clientX === 'number') ? e.clientX - rect.left : rect.width * 0.5;
      var oy = (typeof e.clientY === 'number') ? e.clientY - rect.top : rect.height * 0.5;
      spawnRipple(ox, oy);

      var durationS = (transitionVideo && transitionVideo.duration && isFinite(transitionVideo.duration))
        ? transitionVideo.duration
        : FALLBACK_DURATION_S;
      var durationMs = Math.round(durationS * 1000);

      if (!reduced) {
        var fadeLeadMs = Math.min(FADE_TO_BLACK_MS, durationMs);
        fadeStartTimer = setTimeout(beginBlackout, Math.max(0, durationMs - fadeLeadMs));
      }
      fallbackTimer = setTimeout(completeTransition, durationMs + END_BUFFER_MS);
    }

    // Freeze the loop on ITS OWN opening frame — not wherever the tap
    // happened to land mid-cycle — so the crossfade always hands off from a
    // frame that actually matches transitionVideo's start. Setting
    // currentTime on a playing video is an ASYNC seek: JS state
    // (currentTime/paused) updates immediately, but the browser hasn't
    // necessarily finished decoding/painting that frame yet — especially on
    // mobile. Pausing first avoids any visible jump from the seek itself;
    // 'seeked' confirms the corrected frame is actually ready to paint
    // before reveal() starts the crossfade. Short timeout fallback in case
    // 'seeked' never fires.
    if (portalLoop) {
      portalLoop.pause();
      var revealed = false;
      var doReveal = function(){
        if (revealed) return;
        revealed = true;
        portalLoop.removeEventListener('seeked', doReveal);
        reveal();
      };
      portalLoop.addEventListener('seeked', doReveal);
      setTimeout(doReveal, 80);
      try { portalLoop.currentTime = 0; } catch (err) { doReveal(); }
    } else {
      reveal();
    }
  });

  if (transitionVideo) {
    transitionVideo.addEventListener('ended', function(){
      if (!entering) return;
      completeTransition();
    });
  }


  sizeCanvas();
})();
</script>
</body>
</html>
